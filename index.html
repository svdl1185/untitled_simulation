<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Surface &amp; School</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="vignette"></div>
    <header class="hud-top">
      <div>
        <p class="kicker">Open-ocean simulation</p>
        <h1>Surface &amp; School</h1>
      </div>
      <button type="button" id="btn-menu" aria-expanded="false" aria-controls="menu">
        Menu
        <kbd>M</kbd>
      </button>
    </header>
    <aside class="hud-left">
      <div class="stat">
        <span>Fish</span>
        <strong id="fish-count">0</strong>
      </div>
      <div class="stat">
        <span>P / Z</span>
        <strong id="bloom-count">—</strong>
      </div>
      <div class="stat">
        <span>Schools</span>
        <strong id="school-count">2</strong>
      </div>
      <div class="stat">
        <span>Hunger</span>
        <strong id="hunger-count">—</strong>
      </div>
      <div class="stat">
        <span>Eaten</span>
        <strong id="eaten-count">0</strong>
      </div>
      <div class="stat">
        <span>FPS</span>
        <strong id="fps">—</strong>
      </div>
      <div class="stat">
        <span>Camera</span>
        <strong id="cam-mode">Cinematic</strong>
      </div>
      <div class="stat">
        <span>Shark</span>
        <strong id="control-state">AI patrol</strong>
      </div>
      <div class="stat">
        <span>Sky</span>
        <strong id="tod-label">Morning</strong>
      </div>
    </aside>
    <div id="menu-backdrop" hidden></div>
    <aside id="menu" hidden>
      <div class="menu-head">
        <h2>Options</h2>
        <button type="button" id="btn-menu-close">Close</button>
      </div>
      <div id="menu-body"></div>
    </aside>
    <p id="pilot-hint">Drag to look around · Scroll zoom · V free roam · C camera · P pilot</p>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
