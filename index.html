<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>untitled_ocean_simulation</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="vignette"></div>
    <header class="hud-top">
      <h1 class="brand">untitled_ocean_simulation</h1>
      <nav class="nav-bar" aria-label="Simulation">
        <button type="button" id="btn-return" disabled title="Return to the last world map">
          Return
        </button>
        <button type="button" id="btn-map" aria-pressed="false">
          Map
          <kbd>O</kbd>
        </button>
        <button type="button" id="btn-notes" aria-expanded="true" aria-controls="hud-notes-body">
          Field notes
          <kbd>I</kbd>
        </button>
        <button type="button" id="btn-menu" aria-expanded="false" aria-controls="menu">
          Menu
          <kbd>M</kbd>
        </button>
      </nav>
    </header>
    <aside class="hud-left" id="hud-subject" hidden>
      <section class="hud-panel">
        <h3 id="hud-subject-kind">Subject</h3>
        <p class="hud-subject-title" id="hud-subject-title"></p>
        <p class="hud-subject-sub" id="hud-subject-sub"></p>
        <div class="hud-notes" id="hud-subject-notes"></div>
        <div class="hud-stats" id="hud-subject-body"></div>
        <button type="button" id="hud-follow">Follow</button>
      </section>
    </aside>
    <aside class="hud-right" id="hud-notes">
      <div id="hud-notes-body">
        <section class="hud-panel" id="hud-general">
          <h3>General</h3>
          <div class="hud-stats" id="hud-general-body"></div>
        </section>
      </div>
    </aside>
    <div id="menu-backdrop" hidden></div>
    <aside id="menu" hidden>
      <div class="menu-head">
        <h2>Options</h2>
        <button type="button" id="btn-menu-close">Close</button>
      </div>
      <div id="menu-body"></div>
    </aside>
    <p id="pilot-hint">Click an animal · Drag to look · WASD fly · Scroll dolly · I field notes</p>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
